name: Build dist

# Rebuilds dist/app.js from src whenever the source or build config changes,
# then commits the result back so GitHub Pages serves the fresh bundle.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.mjs'
      - 'babel.config.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit rebuilt dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dist; then
            echo "dist unchanged — nothing to commit"
          else
            git add dist
            git commit -m "chore: rebuild dist [skip ci]"
            git push
          fi
