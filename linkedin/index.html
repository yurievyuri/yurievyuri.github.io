<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Senior PHP & JavaScript Developer — connect, collaborate, hire. Opens my LinkedIn profile.">
<meta property="og:image" content="https://yurev.uk/og-linkedin.png">
<meta property="og:image:secure_url" content="https://yurev.uk/og-linkedin.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Yura Yurev — open on LinkedIn">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Yura Yurev on LinkedIn">
<meta name="twitter:description" content="Senior PHP & JavaScript Developer — connect, collaborate, hire.">
<meta name="twitter:image" content="https://yurev.uk/og-linkedin.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#57d9a3">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#05070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a; --card:#0a0e13; --bar:#0b1016; --border:#1c2530; --line:#161d26;
    --text:#cdd6e4; --dim:#5c6a7a; --green:#57d9a3; --dimg:#3d7a63;
    --cyan:#5cc8ff; --amber:#f0c674; --red:#ff6b6b; --chip:#0e141b;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes ctaIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(87,217,163,.35),0 0 22px -6px rgba(87,217,163,.55)}
                  50%{box-shadow:0 0 0 1px rgba(87,217,163,.55),0 0 40px -4px rgba(87,217,163,.85)}}
  html,body{margin:0;height:100%;background:var(--bg)}
  ::selection{background:var(--green);color:var(--bg)}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
        font-family:'JetBrains Mono',ui-monospace,monospace;
        background:radial-gradient(1200px 800px at 70% -10%,#0c141d 0%,#05070a 60%)}
  .card{width:min(900px,100%);height:min(620px,90vh);display:flex;flex-direction:column;background:var(--card);
        border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;
        box-shadow:0 40px 120px -30px rgba(0,0,0,.8),0 0 0 1px rgba(87,217,163,.04) inset}
  .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bar);
       border-bottom:1px solid var(--line);flex-shrink:0}
  .dot{width:12px;height:12px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .title{flex:1;text-align:center;color:var(--dim);font-size:12.5px;letter-spacing:.04em}
  .screen{flex:1;overflow-y:auto;padding:22px 24px;font-size:14px;color:var(--text);line-height:1.9}
  .screen::-webkit-scrollbar{width:10px}
  .screen::-webkit-scrollbar-thumb{background:#1c2530;border-radius:8px}
  .ln{white-space:pre-wrap;word-break:break-word}
  .dim{color:var(--dim)}.green{color:var(--green)}.cyan{color:var(--cyan)}
  .amber{color:var(--amber)}.red{color:var(--red)}.text{color:var(--text)}.dimg{color:var(--dimg)}
  .cursor{display:inline-block;width:9px;height:1.05em;background:var(--green);
          margin-left:2px;vertical-align:text-bottom;animation:blink 1.05s step-end infinite}
  .cta{margin:22px 0 8px;text-align:center;animation:ctaIn .5s ease both}
  .btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--green);
       background:var(--chip);border:1px solid var(--green);border-radius:10px;
       padding:13px 22px;font-weight:700;letter-spacing:.02em;font-size:15px;
       animation:glow 2.2s ease-in-out infinite}
  .btn:hover{background:#101a16}
  .hint{margin-top:12px;color:var(--dim);font-size:12px;text-align:center}
  a.plain{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">guest@yura — zsh — linkedin</span>
      <span style="width:52px"></span>
    </div>
    <div class="screen" id="screen"></div>
  </div>
</div>
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
              font-family:'JetBrains Mono',monospace;background:#05070a;color:#cdd6e4;text-align:center">
    <p>Open <a class="plain" href="https://www.linkedin.com/in/yura-yurev-67a685182/">Yura on LinkedIn</a></p>
  </div>
</noscript>
<script>
const LINK = "https://www.linkedin.com/in/yura-yurev-67a685182/";
const screen = document.getElementById('screen');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a,b) => Math.floor(a + Math.random()*(b-a));
const hex = n => Array.from({length:n},()=>"0123456789abcdef"[rnd(0,16)]).join('');

function add(html='', cls=''){ const d=document.createElement('div'); d.className='ln '+cls; d.innerHTML=html; screen.appendChild(d); screen.scrollTop=screen.scrollHeight; return d; }
async function type(el, text, per=16){ for(const ch of text){ el.append(ch); screen.scrollTop=screen.scrollHeight; await sleep(per);} }

async function typedLine(prefixHtml, text, per=16, cls=''){
  const el = add(prefixHtml, cls);
  const span = document.createElement('span'); span.className='text'; el.appendChild(span);
  for(const ch of text){ span.append(ch); screen.scrollTop=screen.scrollHeight; await sleep(per); }
  return el;
}

async function progress(label, dur=900, color='green'){
  const el = add(); const steps = 26;
  for(let i=0;i<=steps;i++){
    const filled = '█'.repeat(i), empty = '·'.repeat(steps-i), pct = Math.round(i/steps*100);
    el.innerHTML = `<span class="dim">${label}</span>  <span class="${color}">[${filled}<span class="dim">${empty}</span>] ${String(pct).padStart(3)}%</span>`;
    await sleep(dur/steps);
  }
}

async function spin(label, dur=1100){
  const el = add(); const fr = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏']; const t0 = Date.now(); let i=0;
  while(Date.now()-t0 < dur){ el.innerHTML = `<span class="green">${fr[i%fr.length]}</span> <span class="dim">${label}</span>`; i++; await sleep(70); }
  el.innerHTML = `<span class="green">✓</span> <span class="dim">${label}</span>`;
}

async function run(){
  // prompt + typed command
  const p = add(`<span class="green">guest@yura</span><span class="dim">:</span><span class="cyan">~</span><span class="dim">$ </span>`);
  const cmd = document.createElement('span'); cmd.className='text'; p.appendChild(cmd);
  const cur = document.createElement('span'); cur.className='cursor'; p.appendChild(cur);
  await sleep(400);
  for(const ch of 'linkedin'){ cmd.append(ch); await sleep(90); }
  await sleep(350); cur.remove();

  add('&nbsp;');
  add(`<span class="dimg">linkedin-resolver v2.3 — establishing secure channel …</span>`);
  await sleep(300);

  await typedLine(`<span class="dim">→ </span>`, 'connecting to career.db', 12);
  await sleep(250);
  add(`<span class="dim">  handshake </span><span class="green">✓</span><span class="dim">  ·  tls1.3  ·  latency ${rnd(8,24)}ms</span>`);
  await sleep(300);

  await typedLine(`<span class="cyan">sql&gt; </span>`, "SELECT * FROM humans WHERE name = 'Yura Yurev';", 10);
  await sleep(400);
  add(`<span class="dim">  scanning </span><span class="text">8,412,336</span><span class="dim"> records …</span>`);
  await progress('  index scan', 1000);
  add(`<span class="green">  ✓ 1 row</span><span class="dim"> matched  ·  building response object</span>`);
  await sleep(350);

  add('&nbsp;');
  await spin('computing reputation score', 1000);
  add(`<span class="dim">  normalising skill vectors     </span><span class="text">[ php · go · js · aws · symfony ]</span>`);
  await sleep(220);
  add(`<span class="dim">  cross-referencing 10+ years   </span><span class="green">████████████</span><span class="dim"> done</span>`);
  await sleep(220);
  add(`<span class="dim">  verifying identity hash       </span><span class="amber">0x${hex(4)}…${hex(4)}</span> <span class="green">✓</span>`);
  await sleep(260);
  await progress('  finalising', 720, 'cyan');

  add('&nbsp;');
  await typedLine(`<span class="green">✓ </span>`, `profile located — confidence 99.98%`, 12);
  await sleep(350);

  const cta = document.createElement('div'); cta.className='cta';
  cta.innerHTML = `<a class="btn" href="${LINK}" rel="noopener">↗&nbsp; open Yura on LinkedIn</a>
                   <div class="hint">press <span class="green">⏎ Enter</span> or click · <a class="plain" href="https://yurev.uk">back to terminal</a></div>`;
  screen.appendChild(cta); screen.scrollTop = screen.scrollHeight;

  const go = () => window.location.href = LINK;
  document.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}
run();
</script>
</body>
</html>
