<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       font-family:ui-monospace,'SF Mono','Menlo',monospace;
       background:radial-gradient(1200px 900px at 72% -20%,#0c141d 0%,#05070a 62%)}
  .card{width:1080px;height:500px;display:flex;flex-direction:column;background:#0a0e13;
        border:1px solid #1c2530;border-radius:18px;overflow:hidden;
        box-shadow:0 60px 140px -40px rgba(0,0,0,.85),0 0 0 1px rgba(87,217,163,.05) inset}
  .bar{display:flex;align-items:center;gap:11px;padding:20px 26px;background:#0b1016;border-bottom:1px solid #161d26}
  .dot{width:16px;height:16px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .ttl{flex:1;text-align:center;color:#5c6a7a;font-size:18px;letter-spacing:.04em}
  .body{flex:1;padding:44px 52px;display:flex;flex-direction:column;justify-content:center}
  .prompt{font-size:22px;margin-bottom:26px}
  .p1{color:#57d9a3}.p2{color:#5c6a7a}.p3{color:#5cc8ff}.p4{color:#cdd6e4}
  .name{font-size:76px;font-weight:700;color:#57d9a3;letter-spacing:.06em;line-height:1.05}
  .role{font-size:33px;font-weight:600;color:#f0c674;margin-top:16px;letter-spacing:.01em}
  .meta{font-size:23px;color:#8b97a6;margin-top:18px}
  .chips{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{font-size:19px;color:#cdd6e4;border:1px solid #1c2530;background:#0e141b;border-radius:8px;padding:6px 14px}
  .foot{display:flex;align-items:center;justify-content:space-between;
        padding:16px 52px;color:#5c6a7a;font-size:20px;border-top:1px solid #161d26}
  .cur{display:inline-block;width:13px;height:24px;background:#57d9a3;margin-left:4px;vertical-align:-4px}
  .site{color:#5cc8ff}
</style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="ttl">guest@yura — zsh — 1080×500</span>
      <span style="width:80px"></span>
    </div>
    <div class="body">
      <div class="prompt"><span class="p1">guest@yura</span><span class="p2">:</span><span class="p3">~</span><span class="p2">$ </span><span class="p4">whoami</span></div>
      <div class="name">YURA&nbsp;&nbsp;YUREV</div>
      <div class="role">Senior PHP &amp; JavaScript Developer</div>
      <div class="meta">London · 10+ years · full-stack · CRM · cloud</div>
      <div class="chips">
        <span class="chip">PHP</span><span class="chip">Go</span><span class="chip">React</span>
        <span class="chip">Next.js</span><span class="chip">Symfony</span><span class="chip">AWS</span>
      </div>
    </div>
    <div class="foot">
      <span><span class="p1">guest@yura</span><span class="p2">:</span><span class="p3">~</span><span class="p2">$</span><span class="cur"></span></span>
      <span class="site">yurev.uk</span>
    </div>
  </div>
</body>
</html>
